<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Certidão Reborn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      min-height: 100vh;
    }

    /* Layout Principal com Sidebar */
    .sidebar {
      width: 250px;
      background-color: #1a252f;
      color: #fff;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }

    .sidebar h2 {
      font-size: 18px;
      color: #ecf0f1;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #34495e;
      text-align: center;
    }

    .sidebar-btn {
      width: 100%;
      padding: 12px 15px;
      background-color: #2c3e50;
      color: #ecf0f1;
      border: 1px solid #34495e;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-btn:hover:not(:disabled) {
      background-color: #34495e;
      color: #fff;
    }

    .sidebar-btn:disabled {
      background-color: #1a252f;
      color: #7f8c8d;
      border-color: #2c3e50;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .sidebar-btn.active {
      background-color: #3182ce;
      color: #fff;
      border-color: #2b6cb0;
    }

    .sidebar-divider {
      height: 1px;
      background-color: #34495e;
      margin: 10px 0;
    }

    .main-content {
      margin-left: 250px;
      flex: 1;
      padding: 25px;
      width: calc(100% - 250px);
    }

    .header {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 22px;
      color: #1a252f;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #4a5568;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    .grid-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-block;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #3182ce;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background-color: #2b6cb0;
    }

    .btn-secondary {
      background-color: #4a5568;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #2d3748;
    }

    .btn-cancel {
      background-color: #e53e3e;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-cancel:hover {
      background-color: #c53030;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .status.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .status.error {
      background-color: #fed7d7;
      color: #742a2a;
      border: 1px solid #feb2b2;
    }

    .status.loading {
      background-color: #ebf8ff;
      color: #2c5282;
      border: 1px solid #bee3f8;
      display: block;
    }

    .search-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-section input {
      flex: 1;
    }

    .table-responsive {
      overflow-x: auto;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f7fafc;
      color: #4a5568;
      font-weight: 600;
    }

    tr.linha-registro {
      cursor: pointer;
      transition: background-color 0.15s;
    }

    tr.linha-registro:hover {
      background-color: #edf2f7;
    }

    tr.linha-registro.selected {
      background-color: #ebf8ff !important;
      border-left: 4px solid #3182ce;
    }

    .matricula-tag {
      font-family: monospace;
      font-weight: bold;
      background: #edf2f7;
      padding: 2px 6px;
      border-radius: 4px;
      color: #2d3748;
    }

    #containerFormulario {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }
      .main-content {
        margin-left: 0;
        width: 100%;
      }
      .grid-form {
        grid-template-columns: 1fr;
      }
      .form-group.full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <!-- Menu Lateral Esquerdo -->
  <div class="sidebar">
    <h2>Painel Reborn</h2>
    
    <button type="button" class="sidebar-btn" id="btnIncluirNova" onclick="abrirFormularioIncluir()">
      ➕ Incluir Nova
    </button>
    
    <button type="button" class="sidebar-btn" id="btnEditar" disabled onclick="abrirFormularioEditar()">
      ✏️ Editar
    </button>
    
    <div class="sidebar-divider"></div>
    
    <button type="button" class="sidebar-btn" id="btnImprimir" disabled onclick="imprimirCertidao()">
      🖨️ Imprimir / Salvar PDF
    </button>
  </div>

  <!-- Conteúdo Principal -->
  <div class="main-content">

    <div class="header">
      <h1>Painel Administrativo Reborn</h1>
      <button type="button" class="btn btn-secondary" onclick="carregarRegistros()">Atualizar Lista</button>
    </div>

    <!-- Autenticação GitHub -->
    <div class="card">
      <h2>1. Autenticação GitHub</h2>
      <div class="form-group">
        <label for="token">Personal Access Token (PAT):</label>
        <input type="password" id="token" placeholder="Cole seu token de acesso do GitHub aqui para permitir alterações">
      </div>
    </div>

    <!-- Formulário de Cadastro / Edição -->
    <div class="card" id="containerFormulario">
      <h2 id="tituloFormulario">Cadastrar Nova Certidão</h2>
      <form id="formCadastro">
        <input type="hidden" id="matriculaEdicao" value="">
        
        <div class="grid-form">
          <div class="form-group full">
            <label for="nomeBebe">Nome do Bebê:</label>
            <input type="text" id="nomeBebe" required placeholder="Digite o nome completo do bebê">
          </div>

          <div class="form-group">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" required>
          </div>

          <div class="form-group">
            <label for="horaNascimento">Hora de Nascimento:</label>
            <input type="time" id="horaNascimento" required>
          </div>

          <div class="form-group">
            <label for="peso">Peso:</label>
            <input type="text" id="peso" placeholder="ex: 2.500 kg" required>
          </div>

          <div class="form-group">
            <label for="comprimento">Comprimento:</label>
            <input type="text" id="comprimento" placeholder="ex: 48 cm" required>
          </div>

          <div class="form-group">
            <label for="corOlhos">Cor dos Olhos:</label>
            <input type="text" id="corOlhos" placeholder="ex: Castanhos / Azul">
          </div>

          <div class="form-group">
            <label for="corCabelo">Cor do Cabelo:</label>
            <input type="text" id="corCabelo" placeholder="ex: Castanho escuro / Loiro">
          </div>

          <div class="form-group full">
            <label for="nomeMaePai">Nome da Mãe ou Pai:</label>
            <input type="text" id="nomeMaePai" required placeholder="Nome completo dos responsáveis">
          </div>

          <div class="form-group">
            <label for="parteira">Nome da Parteira:</label>
            <input type="text" id="parteira" required placeholder="Nome da cegonha/parteira">
          </div>

          <div class="form-group">
            <label for="parteiraAuxiliar">Parteira Auxiliar:</label>
            <input type="text" id="parteiraAuxiliar" required placeholder="Nome da auxiliar">
          </div>

          <div class="form-group full">
            <label for="localNascimento">Local de Nascimento:</label>
            <input type="text" id="localNascimento" placeholder="ex: Maternidade Reborn - São Paulo" required>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="submit" class="btn btn-primary" id="btnSalvarForm">Salvar e Gerar Certidão</button>
          <button type="button" class="btn btn-cancel" onclick="fecharFormulario()">Cancelar</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </div>

    <!-- Tabela de Registros -->
    <div class="card">
      <h2>2. Registros Existentes no Sistema</h2>
      
      <div class="search-section">
        <input type="text" id="buscaTabela" placeholder="Buscar por matrícula ou nome do bebê..." onkeyup="filtrarTabela()">
      </div>

      <div class="table-responsive">
        <table id="tabelaRegistros">
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nome do Bebê</th>
              <th>Data Nasc.</th>
              <th>Mãe/Pai</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <tr>
              <td colspan="4" style="text-align: center; color: #a0aec0;">Nenhum registro carregado ou token não informado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
<script>
  const owner = "mytsesait";
  const repo = "neomater";
  const path = "dados.json";
  let listaGlobalRegistros = [];
  let matriculaSelecionada = null;

  function formatarDataBR(dataISO) {
    if (!dataISO) return "";
    const partes = dataISO.split("-");
    if (partes.length === 3) {
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    return dataISO;
  }

  async function carregarRegistros() {
    const token = document.getElementById("token").value.trim();
    const corpoTabela = document.getElementById("corpoTabela");

    try {
      const headers = {};
      if (token) headers["Authorization"] = `token ${token}`;

      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?v=${new Date().getTime()}`, {
        headers: headers
      });

      if (response.ok) {
        const fileData = await response.json();
        listaGlobalRegistros = JSON.parse(atob(fileData.content));
        
        // Mantém a ordem decrescente (mais recente primeiro)
        listaGlobalRegistros.reverse();

        renderizarTabela(listaGlobalRegistros);
      } else if (response.status === 404) {
        corpoTabela.innerHTML = `<tr><td colspan="4" style="text-align: center;">Nenhum registro cadastrado ainda (dados.json não existe).</td></tr>`;
      } else {
        throw new Error("Erro ao carregar dados do GitHub.");
      }
    } catch (err) {
      console.error(err);
      corpoTabela.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Erro ao carregar registros. Verifique a conexão ou a permissão.</td></tr>`;
    }
  }

  function renderizarTabela(dados) {
    const corpoTabela = document.getElementById("corpoTabela");
    corpoTabela.innerHTML = "";

    if (!dados || dados.length === 0) {
      corpoTabela.innerHTML = `<tr><td colspan="4" style="text-align: center;">Nenhum registro encontrado.</td></tr>`;
      desselecionarRegistro();
      return;
    }

    dados.forEach(item => {
      const tr = document.createElement("tr");
      tr.className = "linha-registro";
      if (matriculaSelecionada === item.matricula) {
        tr.classList.add("selected");
      }

      tr.innerHTML = `
        <td><span class="matricula-tag">${item.matricula || '-'}</span></td>
        <td><strong>${item.nomeBebe || '-'}</strong></td>
        <td>${formatarDataBR(item.dataNascimento)}</td>
        <td>${item.nomeMaePai || '-'}</td>
      `;

      tr.addEventListener("click", () => alternarSelecaoRegistro(item.matricula));
      corpoTabela.appendChild(tr);
    });
  }

  function alternarSelecaoRegistro(matricula) {
    if (matriculaSelecionada === matricula) {
      desselecionarRegistro();
    } else {
      matriculaSelecionada = matricula;
      document.getElementById("btnEditar").disabled = false;
      document.getElementById("btnImprimir").disabled = false;
    }
    renderizarTabela(listaGlobalRegistros);
  }

  function desselecionarRegistro() {
    matriculaSelecionada = null;
    document.getElementById("btnEditar").disabled = true;
    document.getElementById("btnImprimir").disabled = true;
  }

  function filtrarTabela() {
    const termo = document.getElementById("buscaTabela").value.toLowerCase();
    const filtrados = listaGlobalRegistros.filter(r => {
      const matricula = (r.matricula || "").toLowerCase();
      const nome = (r.nomeBebe || "").toLowerCase();
      const responsavel = (r.nomeMaePai || "").toLowerCase();
      return matricula.includes(termo) || nome.includes(termo) || responsavel.includes(termo);
    });
    renderizarTabela(filtrados);
  }

  function abrirFormularioIncluir() {
    document.getElementById("tituloFormulario").textContent = "1. Cadastrar Nova Certidão";
    document.getElementById("btnSalvarForm").textContent = "Salvar e Gerar Certidão";
    document.getElementById("matriculaEdicao").value = "";
    document.getElementById("formCadastro").reset();
    document.getElementById("containerFormulario").style.display = "block";
    document.getElementById("nomeBebe").focus();
  }

  function abrirFormularioEditar() {
    if (!matriculaSelecionada) return;

    const registro = listaGlobalRegistros.find(r => r.matricula === matriculaSelecionada);
    if (!registro) return;

    document.getElementById("tituloFormulario").textContent = `1. Editar Certidão (Matrícula: ${registro.matricula})`;
    document.getElementById("btnSalvarForm").textContent = "Atualizar Certidão";
    document.getElementById("matriculaEdicao").value = registro.matricula;

    document.getElementById("nomeBebe").value = registro.nomeBebe || "";
    document.getElementById("dataNascimento").value = registro.dataNascimento || "";
    document.getElementById("horaNascimento").value = registro.horaNascimento || "";
    document.getElementById("peso").value = registro.peso || "";
    document.getElementById("comprimento").value = registro.comprimento || "";
    document.getElementById("corOlhos").value = registro.corOlhos || "";
    document.getElementById("corCabelo").value = registro.corCabelo || "";
    document.getElementById("nomeMaePai").value = registro.nomeMaePai || "";
    document.getElementById("parteira").value = registro.parteira || "";
    document.getElementById("parteiraAuxiliar").value = registro.parteiraAuxiliar || "";
    document.getElementById("localNascimento").value = registro.localNascimento || "";

    document.getElementById("containerFormulario").style.display = "block";
    document.getElementById("nomeBebe").focus();
  }

  function fecharFormulario() {
    document.getElementById("containerFormulario").style.display = "none";
    document.getElementById("formCadastro").reset();
    document.getElementById("matriculaEdicao").value = "";
    document.getElementById("status").style.display = "none";
  }

  function imprimirCertidao() {
    if (!matriculaSelecionada) return;
    window.open(`index.html?m=${encodeURIComponent(matriculaSelecionada)}`, '_blank');
  }

  document.getElementById("formCadastro").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const token = document.getElementById("token").value.trim();
    const statusDiv = document.getElementById("status");
    const matriculaEdicao = document.getElementById("matriculaEdicao").value;

    if (!token) {
      alert("Por favor, informe o Personal Access Token no campo de Autenticação antes de salvar.");
      document.getElementById("token").focus();
      return;
    }

    statusDiv.className = "status loading";
    statusDiv.textContent = "Obtendo dados do repositório...";

    try {
      let sha = "";
      let registros = [];

      const getResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        headers: { "Authorization": `token ${token}` }
      });

      if (getResponse.ok) {
        const fileData = await getResponse.json();
        sha = fileData.sha;
        registros = JSON.parse(atob(fileData.content));
      }

      let matriculaFinal = matriculaEdicao;

      if (!matriculaEdicao) {
        const anoAtual = new Date().getFullYear();
        let novoSequencial = 1;

        if (registros.length > 0) {
          const ultimosNumeros = registros.map(r => {
            const m = r.matricula || "";
            const parte = m.substring(3, 6);
            return parseInt(parte, 10) || 0;
          });
          novoSequencial = Math.max(...ultimosNumeros) + 1;
        }

        const sequencialFormatado = String(novoSequencial).padStart(3, '0');
        matriculaFinal = `999${sequencialFormatado} 01 55 ${anoAtual}`;
      }

      const dadosForm = {
        matricula: matriculaFinal,
        nomeBebe: document.getElementById("nomeBebe").value.trim(),
        dataNascimento: document.getElementById("dataNascimento").value,
        horaNascimento: document.getElementById("horaNascimento").value,
        peso: document.getElementById("peso").value.trim(),
        comprimento: document.getElementById("comprimento").value.trim(),
        corOlhos: document.getElementById("corOlhos").value.trim(),
        corCabelo: document.getElementById("corCabelo").value.trim(),
        nomeMaePai: document.getElementById("nomeMaePai").value.trim(),
        parteira: document.getElementById("parteira").value.trim(),
        parteiraAuxiliar: document.getElementById("parteiraAuxiliar").value.trim(),
        localNascimento: document.getElementById("localNascimento").value.trim()
      };

      if (matriculaEdicao) {
        const idx = registros.findIndex(r => r.matricula === matriculaEdicao);
        if (idx !== -1) {
          registros[idx] = dadosForm;
        } else {
          registros.push(dadosForm);
        }
      } else {
        registros.push(dadosForm);
      }

      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(registros, null, 2))));

      statusDiv.textContent = "Enviando dados para o GitHub...";

      const putBody = {
        message: matriculaEdicao ? `Atualização de registro: ${matriculaFinal}` : `Novo registro de certidão: ${matriculaFinal}`,
        content: contentEncoded
      };
      if (sha) putBody.sha = sha;

      const putResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(putBody)
      });

      if (putResponse.ok) {
        statusDiv.className = "status success";
        statusDiv.textContent = matriculaEdicao ? `Certidão atualizada com sucesso!` : `Certidão salva com sucesso! Nº de Matrícula: ${matriculaFinal}`;
        
        setTimeout(() => {
          fecharFormulario();
          carregarRegistros();
        }, 1200);
      } else {
        const errData = await putResponse.json();
        throw new Error(errData.message || "Erro ao atualizar dados no servidor GitHub.");
      }

    } catch (err) {
      statusDiv.className = "status error";
      statusDiv.textContent = "Erro: " + err.message;
    }
  });

  document.getElementById("token").addEventListener("blur", function() {
    if (this.value.trim()) {
      carregarRegistros();
    }
  });
</script>

</body>
</html>
